<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <header>
      <a href="./index.html" class="header-logo">Solarity Spots</a>
      <button class="nav-open-btn">&#9776;</button>

      <nav class="nav-container">
        <div class="nav-links">
          <a href="./index.html" class="secondary-btn">Home</a>
          <a href="#" class="logout-btn primary-btn">Log Out</a>
          <a href="./signup.html" class="signup-btn primary-btn">Sign Up</a>
        </div>
      </nav>
    </header>

    <section class="hero-content">
      <h1>Login to your account</h1>
      <p>Fill in the form below to login your account</p>

      <form class="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="me@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button>Log In</button>
      </form>
      <p>Dont have an account? <a href="./signup.html">Sign Up</a></p>
    </section>

    <script type="module" src="./JS/headerNav.js"></script>
  </body>
</html>
